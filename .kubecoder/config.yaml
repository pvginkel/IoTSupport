cwd: IoTSupport

repos:
  - url: https://github.com/pvginkel/IoTSupportSpecs
    path: IoTSupportSpecs
    shared: true

capabilities:
  github: rw

# All three are verified in use, but not all three by the suites — check before
# dropping one:
#   postgres   — the dev stack's database. backend/scripts/init-dev-database.py
#                creates it and `cli upgrade-db` migrates it, both in setup:, and
#                /health/readyz reports checks.database.status. Both suites use
#                it too, through TEST_DATABASE_ADMIN_URL: pytest builds a template
#                database per run from the revisions, and the Playwright harness a
#                seed database, each served to the tests as clones.
#   s3storage  — S3 (RustFS) for firmware and attachments. Hard dependency of
#                the backend suite: tests/conftest_infrastructure.py probes
#                S3_ENDPOINT_URL in pytest_configure and aborts the whole run if
#                it is unreachable. Also a CI validation-pod sidecar.
#   opensearch — the device log viewer's backing store, via ELASTICSEARCH_URL
#                (backend/scripts/generate-dev-env.sh points it at localhost:9200).
#                Used by the dev stack and a CI validation-pod sidecar. pytest
#                mocks the HTTP client, but the Playwright device specs need it:
#                the log viewer's history query (GET /api/devices/<id>/logs) reads
#                it unless a spec seeded logs in memory, and answers 503 when it
#                is unreachable (7 specs in devices-logs*, devices-tabs and
#                devices-crud).
services:
  - postgres
  - s3storage
  - opensearch

# backend/Dockerfile and frontend/Dockerfile are CI's (helmCharts.kaniko2), and
# neither is wired into a build: verb. This is still needed so the two
# scripts/build-image.sh wrappers can build them by hand in-env.
imageBuilder: true

# Creating a device creates a Keycloak client, so the Playwright suite cannot run
# without an admin client — 70 of its 138 tests fail with "Keycloak admin API not
# configured". The non-secret coordinates (base URL, realm, token URL) are written
# into backend/.env by backend/scripts/generate-dev-env.sh.
secrets:
  KEYCLOAK_ADMIN_CLIENT_ID: iotsupport-keycloak-admin-client-id
  KEYCLOAK_ADMIN_CLIENT_SECRET: iotsupport-keycloak-admin-client-secret

# One merged sidecar rather than `python` + `frontend`: the Playwright harness
# boots the Flask backend per worker (tests/support/process/servers.ts), so a
# single command needs both toolsets in the same container.
tools:
  - use: modern-app
  - use: aac-tools # arch-validate, the last statement of both components' lint
  - use: iac # kubectl, to read the prd deployment's state and pod logs

ports:
  - name: frontend
    port: 3100
    type: http
    sslOffload: true
  - name: backend
    port: 3101
    type: http

preamble:
  instructions: |
    Operational hazards specific to this environment:

    - `kc project lint` is green at HEAD, so a red lint is your change's.
    - `kc project lint` stops at the first failing statement, so a failure hides
      the state of every statement behind it. Run them individually when you
      need to know what they say.
    - `kaniko` is a dev-container binary (`kaniko --context <dir> --destination
      <ref>`), not a `cexec` target. There is no kaniko toolchain sidecar.
    - `scripts/dev.py` ignores SIGINT and SIGTERM by design and relies on the
      terminal delivering SIGINT through the pty. `kill` on it orphans the whole
      process tree and leaves ports 3100-3101 held. Stop it with Ctrl-C.
